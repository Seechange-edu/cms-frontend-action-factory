name: Build and Push dist

on:
  release:
    types: [created]

# 使用并发取消任何当前作业或运行
concurrency:
  group: ${{github.ref}}
  cancel-in-progress: true

jobs:
  action_trigger:
    if:  startsWith(github.ref, 'refs/tags/cms-frontend/')
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Required for OIDC authentication with AWS
      contents: read    # Required for actions/checkout
    strategy:
      fail-fast: false
    # Exposed so prune-images / notify-teams can run as separate jobs without re-parsing the Release.
    outputs:
      remote_host: ${{ steps.deploy-vars.outputs.remote_host }}
      teams_webhook: ${{ steps.deploy-vars.outputs.teams_webhook }}
      active: ${{ steps.deploy-vars.outputs.active }}
      image_tag: ${{ steps.deploy-vars.outputs.image_tag }}
      ecr_registry: ${{ steps.login-pf-aws-ecr.outputs.registry }}
      source_repo: ${{ steps.relinfo.outputs.source_repo }}
      commit_sha: ${{ steps.relinfo.outputs.commit_sha }}
      commit_short: ${{ steps.relinfo.outputs.commit_short }}
      commit_message: ${{ steps.relinfo.outputs.commit_message }}
      commit_url: ${{ steps.relinfo.outputs.commit_url }}
      release_notes: ${{ steps.relinfo.outputs.release_notes }}
    steps:
      - name: get tag info
        uses: Seechange-edu/Parse-Action-Tag@main
        with:
          githubToken: ${{ secrets.ACCESS_TOKEN }}
          type: parse

      # Runs before the build so notify-teams still has the webhook/tag when a later step fails.
      - name: Export deploy vars
        id: deploy-vars
        run: |
          {
            echo "remote_host=${{ env.REMOTE_HOST }}"
            echo "teams_webhook=${{ env.TEAMS_WEBHOOK }}"
            echo "active=${{ env.ACTIVE }}"
            echo "image_tag=${{ env.BRANCH }}"
          } >> "$GITHUB_OUTPUT"

      - name: checkout code
        uses: actions/checkout@v4
        with:
          repository: SeeChange-edu/${{ env.REPOSITORY }}
          token: ${{ secrets.ACCESS_TOKEN }}
          ref: ${{ env.BRANCH }}

      # Commit + release notes for the Teams card. Runs before the build so a failed build still notifies with context.
      - name: Collect commit and release info
        id: relinfo
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          SRC_REPO: SeeChange-edu/${{ env.REPOSITORY }}
          REF: ${{ env.BRANCH }}
        run: |
          SHA=$(git rev-parse HEAD)
          SHORT=$(git rev-parse --short HEAD)
          SUBJECT=$(git log -1 --pretty=%s)
          # Release notes exist only when BRANCH is a release tag (prod); empty for branch deploys (dev).
          NOTES=$(gh release view "$REF" --repo "$SRC_REPO" --json body -q .body 2>/dev/null | head -c 1500 || true)
          # Fallback text keeps the card's notes block non-empty (avoids relying on Adaptive Card isVisible).
          if [ -z "$NOTES" ]; then NOTES="_(no release notes — branch deploy)_"; fi
          D=$(openssl rand -hex 8)
          {
            echo "source_repo=$SRC_REPO"
            echo "commit_sha=$SHA"
            echo "commit_short=$SHORT"
            echo "commit_url=${{ github.server_url }}/$SRC_REPO/commit/$SHA"
            echo "commit_message<<$D"
            echo "$SUBJECT"
            echo "$D"
            echo "release_notes<<$D"
            echo "$NOTES"
            echo "$D"
          } >> "$GITHUB_OUTPUT"

      - name: setup nodejs
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn

      - name: Build Yarn
        run: |
            yarn --frozen-lockfile
            echo ${{ env.PUSHREF }}
            cp ./env/${{ env.PUSHREF }}.env .env.production
            yarn build

      - name: Setup AWS ECR Details (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-ECR-Push
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to AWS ECR
        id: login-pf-aws-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-pf-aws-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY }}
          IMAGE_TAG: ${{ env.BRANCH }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}/${{ env.ACTIVE }}:${IMAGE_TAG}"
          echo "IMAGE_URI=${IMAGE_URI}" >> $GITHUB_ENV
          docker build --tag ${IMAGE_URI} --file Dockerfile-Self .
          docker push ${IMAGE_URI}

      - name: Get ECR login token
        id: ecr-login-token
        run: |
          ECR_TOKEN=$(aws ecr get-login-password --region ${{ vars.AWS_REGION }})
          echo "token<<EOF" >> $GITHUB_OUTPUT
          echo "$ECR_TOKEN" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: SSH and Run Docker image
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.REMOTE_HOST }}
          username: ${{ vars.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          envs: ECR_REGISTRY,ECR_TOKEN,IMAGE_URI
          script: |
            # Login to AWS ECR using temporary token from GitHub Actions
            echo ${ECR_TOKEN} | docker login --username AWS --password-stdin ${ECR_REGISTRY}

            docker pull ${IMAGE_URI}
            if [ "$(docker ps -a --format '{{.Names}}' | grep -c ${{ env.PREV_NAME }})" -gt 0 ]; then
              docker rm -f ${{ env.PREV_NAME }}
            fi
            if [ "$(docker ps -a --format '{{.Names}}' | grep -c ${{ env.NAME }})" -gt 0 ]; then
              docker rm -f ${{ env.NAME }}
            fi
            docker run --name ${{ env.NAME }} -d -p ${{ env.OUT_PORT }}:${{ env.PORT }} --restart unless-stopped ${IMAGE_URI}
            # Image pruning moved to the prune-images job, which never fails the
            # run: a prune already running on the host would fail this script and
            # mark a deploy that actually succeeded as red.
            # docker container prune --force
        env:
          ECR_REGISTRY: ${{ steps.login-pf-aws-ecr.outputs.registry }}
          ECR_TOKEN: ${{ steps.ecr-login-token.outputs.token }}
          IMAGE_URI: ${{ env.IMAGE_URI }}

  # User-facing notes for a prod release that just deployed, written into
  # the source repository's (private) release, below the GitHub notes. Only
  # when that release asked for them (release-meta `changelog`); otherwise
  # repo-toolkit reads it and stops in seconds. Never fails the run.
  #
  # 🔴 This repository is PUBLIC: its logs, job summaries and artifacts are
  # readable by anyone. `quiet` keeps the notes and error details out of
  # them, and nothing in this job may echo the private source.
  changelog:
    needs: [action_trigger]
    # Prod only: a release tag (v3.13.13, v3.12.2-a), not a branch deploy.
    if: needs.action_trigger.result == 'success' && startsWith(needs.action_trigger.outputs.image_tag, 'v')
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the source repository with its history
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.action_trigger.outputs.source_repo }}
          ref: ${{ needs.action_trigger.outputs.image_tag }}
          token: ${{ secrets.ACTION_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      # repo-toolkit is private, and a public repository cannot `uses:` a
      # private action; checked out, it runs as a local one.
      - name: Checkout repo-toolkit
        uses: actions/checkout@v4
        with:
          repository: Seechange-edu/repo-toolkit
          token: ${{ secrets.ACTION_TOKEN }}
          path: .repo-toolkit
          persist-credentials: false

      - name: Write the release notes
        id: notes
        uses: ./.repo-toolkit
        with:
          mode: changelog
          tag: ${{ needs.action_trigger.outputs.image_tag }}
          openaiKey: ${{ secrets.OPENAI_API_KEY }}
          model: ${{ vars.CHANGELOG_MODEL }}
          summaryModel: ${{ vars.CHANGELOG_SUMMARY_MODEL }}
          quiet: 'true'
          dryRun: 'false'
          token: ${{ secrets.ACTION_TOKEN }}

      - name: Tell Teams the notes are ready for review
        if: fromJSON(steps.notes.outputs.result).branches[0].reason == 'documented'
        continue-on-error: true
        env:
          WEBHOOK: ${{ needs.action_trigger.outputs.teams_webhook }}
          TAG: ${{ needs.action_trigger.outputs.image_tag }}
          SOURCE_REPO: ${{ needs.action_trigger.outputs.source_repo }}
          URL: ${{ fromJSON(steps.notes.outputs.result).branches[0].url }}
        run: |
          set -euo pipefail
          [ -n "$WEBHOOK" ] || exit 0
          jq -n \
            --arg title "📝 ${TAG}: user changelog drafted" \
            --arg subtitle "${SOURCE_REPO}" \
            --arg next "AI draft, written below the GitHub notes. Review it before sharing it with users." \
            --arg url "$URL" \
            '{type: "message", attachments: [{contentType: "application/vnd.microsoft.card.adaptive", content: {
              "$schema": "http://adaptivecards.io/schemas/adaptive-card.json", type: "AdaptiveCard", version: "1.4",
              body: [{type: "TextBlock", size: "Medium", weight: "Bolder", wrap: true, text: $title},
                     {type: "TextBlock", spacing: "None", isSubtle: true, wrap: true, text: $subtitle},
                     {type: "TextBlock", spacing: "Medium", wrap: true, text: $next}],
              actions: [{type: "Action.OpenUrl", title: "Open release", url: $url}]}}]}' \
            | curl -fsS -X POST -H 'Content-Type: application/json' -d @- "$WEBHOOK" >/dev/null \
            || echo "::warning::Could not post to Teams."

  # Housekeeping only: never fails the run.
  prune-images:
    needs: [action_trigger]
    if: needs.action_trigger.result == 'success'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      # Its own step, and its own continue-on-error: a prune already running on
      # the host fails this one, and a failed step would otherwise skip the
      # sweep below along with it.
      - name: Prune dangling Docker images
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ needs.action_trigger.outputs.remote_host }}
          username: ${{ vars.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          # A mutable tag such as :dev takes its name off the previous image on
          # every pull, leaving layers the sweep below never looks at.
          script: docker image prune --force

      - name: Prune old semver Docker images
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        env:
          ECR_REGISTRY: ${{ needs.action_trigger.outputs.ecr_registry }}
          ECR_REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY }}
          IMAGE_TAG: ${{ needs.action_trigger.outputs.image_tag }}
          ACTIVE: ${{ needs.action_trigger.outputs.active }}
        with:
          host: ${{ needs.action_trigger.outputs.remote_host }}
          username: ${{ vars.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          envs: ECR_REGISTRY,ECR_REPOSITORY,IMAGE_TAG,ACTIVE
          script: |
            IMAGE_PREFIX="${ECR_REGISTRY}/${ECR_REPOSITORY}/${ACTIVE}"
            CURRENT="${IMAGE_TAG}"

            if ! echo "$CURRENT" | grep -qE '^[vV][0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Skip prune: IMAGE_TAG '${CURRENT}' is not semver"
              exit 0
            fi

            mapfile -t TAGS < <(
              docker images --format '{{.Repository}}:{{.Tag}}' \
                | grep "^${IMAGE_PREFIX}:" \
                | sed "s|^${IMAGE_PREFIX}:||" \
                | grep -E '^[vV][0-9]+\.[0-9]+\.[0-9]+$' \
                | sort -V
            )

            PREV=$(printf '%s\n' "${TAGS[@]}" | sort -V | awk -v cur="$CURRENT" '
              { a[++n]=$0 }
              END { for(i=1;i<=n;i++) if(a[i]==cur && i>1) { print a[i-1]; exit } }')

            if [ -n "$PREV" ]; then
              echo "Keep: ${CURRENT}, ${PREV}"
            else
              echo "Keep: ${CURRENT} only (no previous version)"
            fi

            for tag in "${TAGS[@]}"; do
              [ "$tag" = "$CURRENT" ] && continue
              [ -n "$PREV" ] && [ "$tag" = "$PREV" ] && continue
              echo "Removing ${IMAGE_PREFIX}:${tag}"
              docker rmi "${IMAGE_PREFIX}:${tag}" 2>/dev/null || true
            done

  # Notification only: never fails the run.
  # Targets the Teams "Workflows" webhook (Post to a channel when a webhook request is received),
  # which renders the Adaptive Card in attachments[0].content as-is.
  notify-teams:
    needs: [action_trigger]
    if: always() && needs.action_trigger.outputs.teams_webhook != ''
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Send Teams notification (Power Automate)
        env:
          WEBHOOK: ${{ needs.action_trigger.outputs.teams_webhook }}
          STATUS: ${{ needs.action_trigger.result }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_REPO: ${{ needs.action_trigger.outputs.source_repo }}
          ENVIRONMENT: ${{ needs.action_trigger.outputs.active }}
          TAG: ${{ needs.action_trigger.outputs.image_tag }}
          COMMIT_SHA: ${{ needs.action_trigger.outputs.commit_sha }}
          COMMIT_SHORT: ${{ needs.action_trigger.outputs.commit_short }}
          COMMIT_MESSAGE: ${{ needs.action_trigger.outputs.commit_message }}
          COMMIT_URL: ${{ needs.action_trigger.outputs.commit_url }}
          RELEASE_NOTES: ${{ needs.action_trigger.outputs.release_notes }}
          ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # jq builds the whole Adaptive Card so release notes / commit messages are escaped safely.
          # The Teams Workflows webhook renders attachments[0].content verbatim.
          jq -n \
            --arg status "$STATUS" \
            --arg source_repo "$SOURCE_REPO" \
            --arg environment "$ENVIRONMENT" \
            --arg tag "$TAG" \
            --arg commit_short "$COMMIT_SHORT" \
            --arg commit_message "$COMMIT_MESSAGE" \
            --arg commit_url "$COMMIT_URL" \
            --arg release_notes "$RELEASE_NOTES" \
            --arg actor "$ACTOR" \
            --arg event "$EVENT" \
            --arg run_url "$RUN_URL" \
            '{
              type: "message",
              attachments: [{
                contentType: "application/vnd.microsoft.card.adaptive",
                contentUrl: null,
                content: {
                  "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  type: "AdaptiveCard",
                  version: "1.4",
                  msteams: { width: "Full" },
                  body: [
                    {
                      type: "Container",
                      style: (if $status == "success" then "good" else "attention" end),
                      bleed: true,
                      items: [
                        {
                          type: "TextBlock",
                          text: (if $status == "success" then "✅ Deploy succeeded" else "❌ Deploy failed" end),
                          weight: "Bolder",
                          size: "Medium",
                          wrap: true
                        },
                        {
                          type: "TextBlock",
                          text: ($source_repo + " → " + $environment),
                          spacing: "None",
                          isSubtle: true,
                          wrap: true
                        }
                      ]
                    },
                    {
                      type: "FactSet",
                      facts: [
                        { title: "Environment", value: $environment },
                        { title: "Tag / Branch", value: $tag },
                        { title: "Commit", value: ("[" + $commit_short + "](" + $commit_url + ")") },
                        { title: "Commit message", value: $commit_message },
                        { title: "Triggered by", value: ($actor + " (" + $event + ")") },
                        { title: "Result", value: $status }
                      ]
                    },
                    { type: "TextBlock", text: "**Release notes**", wrap: true, spacing: "Medium" },
                    {
                      type: "Container",
                      style: "emphasis",
                      items: [ { type: "TextBlock", text: $release_notes, wrap: true } ]
                    }
                  ],
                  actions: [
                    { type: "Action.OpenUrl", title: "View workflow run", url: $run_url },
                    { type: "Action.OpenUrl", title: "View commit", url: $commit_url }
                  ]
                }
              }]
            }' \
          | curl -sS --fail-with-body -X POST -H 'Content-Type: application/json' --data @- "$WEBHOOK"
